# Configuração do analisador estático.
#
# Rodar `flutter analyze` deve ser suficiente para pegar os deslizes mais comuns
# antes que virem bug em produção — por isso algumas regras abaixo estão como
# erro, e não como aviso.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Usar o BuildContext depois de um `await` sem checar `mounted` já causou
    # crash neste app; tratar como erro impede que volte.
    use_build_context_synchronously: error
    unawaited_futures: error
    avoid_dynamic_calls: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_unused_constructor_parameters
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
